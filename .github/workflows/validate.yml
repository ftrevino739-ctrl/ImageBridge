name: Validate ImageBridge Mod

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "cloudflare/**"
      - "wrangler.jsonc"
      - "package.json"
      - "README.md"
      - ".github/workflows/validate.yml"
  push:
    paths:
      - "extension/**"
      - "src/**"
      - "cloudflare/**"
      - "wrangler.jsonc"
      - "test/**"
      - ".agents/**"
      - "docs/**"
      - "scripts/**"
      - "package.json"
      - "README.md"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript and plugin metadata
        run: |
          node --check src/server.js
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js
          node --check cloudflare/worker.js
          node --check cloudflare/worker.test.js
          node -e 'JSON.parse(require("fs").readFileSync("wrangler.jsonc", "utf8"));'
          node --check scripts/imagebridge-upload.mjs
          node --check .agents/skills/imagebridge/scripts/upload.mjs
          node --check .agents/plugins/imagebridge/skills/imagebridge/scripts/upload.mjs
          node -e "JSON.parse(require('fs').readFileSync('.agents/plugins/imagebridge/plugin.json','utf8')); JSON.parse(require('fs').readFileSync('.agents/plugins/marketplace.json','utf8'));"
      - name: Run integration tests
        run: npm test
      - name: Package browser extension
        run: |
          cd extension
          zip -r ../ImageBridge-Mod-Chrome.zip .
      - name: Package ChatGPT and Codex plugin
        run: |
          cd .agents/plugins/imagebridge
          zip -r ../../ImageBridge-OpenAI-Plugin.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: ImageBridge-Installers
          path: |
            ImageBridge-Mod-Chrome.zip
            .agents/ImageBridge-OpenAI-Plugin.zip
