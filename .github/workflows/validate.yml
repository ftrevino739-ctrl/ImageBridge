name: Validate ImageBridge Mod

on:
  workflow_dispatch:
  push:
    paths:
      - "extension/**"
      - "src/**"
      - "test/**"
      - ".agents/**"
      - "docs/**"
      - "scripts/**"
      - "package.json"
      - "README.md"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript
        run: |
          node --check src/server.js
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js
          node --check scripts/imagebridge-upload.mjs
          node --check .agents/skills/imagebridge/scripts/upload.mjs
      - name: Run integration tests
        run: npm test
      - name: Package browser extension
        run: |
          cd extension
          zip -r ../ImageBridge-Mod-Chrome.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: ImageBridge-Mod-Chrome
          path: ImageBridge-Mod-Chrome.zip
