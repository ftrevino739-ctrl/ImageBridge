name: Build ImageBridge Desktop

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-build.yml"
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish self-contained Windows application
        run: dotnet publish desktop/ImageBridge.Desktop/ImageBridge.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: ImageBridge-Desktop-win-x64
          path: artifacts/ImageBridge.Desktop.exe
          if-no-files-found: error
